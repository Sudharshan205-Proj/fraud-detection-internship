[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-system"
version = "0.1.0"
description = "Internship fraud-detection case study on the PaySim synthetic financial dataset"
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies are intentionally NOT duplicated here:
# requirements.txt remains the single pinned source of truth.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]
